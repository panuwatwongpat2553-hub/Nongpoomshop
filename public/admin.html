<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>ผู้ดูแล · Nongpoom Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070D;--sf:#0B1020;--el:#111A2D;--el2:#16213a;--bl:#0866FF;--cy:#16D9FF;--pu:#8A70FF;--tx:#F5F7FF;--t2:#A6B1C8;--t3:#6f7c96;--ok:#22C55E;--er:#EF4444;--wa:#FACC15;--ln:#1d2a47;--r:14px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:radial-gradient(60% 40% at 10% 0,rgba(8,102,255,.16),transparent 60%),radial-gradient(50% 40% at 100% 10%,rgba(138,112,255,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx);font:400 14px/1.55 Prompt,system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
small,.mut{color:var(--t2)}.t3{color:var(--t3)}

/* layout */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:rgba(11,16,32,.85);backdrop-filter:blur(10px);border-right:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:17px;background:linear-gradient(135deg,var(--bl),var(--pu));box-shadow:0 0 16px rgba(8,102,255,.45)}
.brand b{display:block;font-size:15px;line-height:1.2}.brand span{font-size:12px;color:var(--t2)}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:11px;color:var(--t2);font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav:hover{background:var(--el);color:var(--tx)}
.nav.on{background:linear-gradient(135deg,rgba(8,102,255,.28),rgba(138,112,255,.18));color:#fff;box-shadow:inset 0 0 0 1px rgba(22,217,255,.3)}
.nav .bd{margin-left:auto;background:var(--er);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px;min-width:22px;text-align:center}
.side .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--el)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:linear-gradient(135deg,var(--cy),var(--bl));color:#031024;flex:none}
.who>div:last-child{min-width:0;flex:1}.who b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{font-size:11.5px}
.main{padding:28px clamp(16px,3vw,40px) 80px;max-width:1180px;width:100%}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}.ph p{color:var(--t2);margin-top:2px}.ph .grow{flex:1}
.grow{flex:1}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid var(--ln);background:var(--el);font-weight:500;white-space:nowrap;transition:transform .12s,border-color .15s,background .15s}
.btn:hover{border-color:#2f4272;background:var(--el2)}.btn:active{transform:scale(.97)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.pri{background:linear-gradient(135deg,var(--bl),var(--pu));border:0;box-shadow:0 4px 18px rgba(8,102,255,.4)}.pri:hover{background:linear-gradient(135deg,#2b7bff,#9d86ff)}
.ok{background:var(--ok);color:#04130a;border:0;font-weight:600}.ok:hover{background:#34d673}
.no{background:rgba(239,68,68,.12);color:#ff8a8a;border-color:rgba(239,68,68,.35)}.no:hover{background:rgba(239,68,68,.22)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--el);border:1px solid var(--ln);border-radius:11px;padding:10px 13px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--bl);box-shadow:0 0 0 3px rgba(8,102,255,.25)}
textarea{resize:vertical}
input[type=file]{padding:8px;font-size:13px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--t2);font-weight:500}
.fld input,.fld select,.fld textarea{color:var(--tx);font-weight:400;font-size:14px}
.fg{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}.fg .full{grid-column:1/-1}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar .srch{flex:1;min-width:200px;max-width:380px}
.seg{display:inline-flex;gap:3px;padding:4px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;flex-wrap:wrap}
.seg button{padding:6px 14px;border-radius:9px;color:var(--t2);font-weight:500;font-size:13px}
.seg button:hover{color:var(--tx)}.seg button.on{background:var(--bl);color:#fff}
.seg i{font-style:normal;opacity:.75;margin-left:5px;font-size:12px}

/* cards & data */
.card{background:linear-gradient(160deg,rgba(17,26,45,.9),rgba(11,16,32,.92));border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.card+.card{margin-top:10px}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.kpis{grid-template-columns:1fr}}
.kpi{display:flex;gap:14px;align-items:center;padding:16px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r)}
.ib,.kpi .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib .ic,.kpi .ico .ic{width:21px;height:21px}
.kpi small{display:block;font-size:12.5px}.kpi b{font-size:22px;font-weight:700;line-height:1.25}
.c-bl{background:rgba(8,102,255,.18);color:#6aa5ff}.c-cy{background:rgba(22,217,255,.15);color:var(--cy)}.c-pu{background:rgba(138,112,255,.18);color:#b3a2ff}
.c-ok{background:rgba(34,197,94,.15);color:#4ade80}.c-wa{background:rgba(250,204,21,.14);color:var(--wa)}.c-er{background:rgba(239,68,68,.15);color:#ff8a8a}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.todo .t{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);border:1px solid var(--ln);background:var(--sf);text-align:left;width:100%;transition:border-color .15s,transform .15s}
.todo .t:hover{border-color:var(--cy);transform:translateY(-2px)}
.todo .t b{display:block;font-size:15px}.todo .t span.n{font-size:28px;font-weight:700;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid transparent}
.p-wa{background:rgba(250,204,21,.12);color:var(--wa);border-color:rgba(250,204,21,.3)}.p-ok{background:rgba(34,197,94,.12);color:#4ade80;border-color:rgba(34,197,94,.3)}
.p-er{background:rgba(239,68,68,.12);color:#ff8a8a;border-color:rgba(239,68,68,.3)}.p-bl{background:rgba(8,102,255,.14);color:#7fb0ff;border-color:rgba(8,102,255,.35)}.p-mu{background:var(--el);color:var(--t2);border-color:var(--ln)}
.alert{display:flex;gap:12px;padding:13px 16px;border-radius:var(--r);background:rgba(250,204,21,.07);border:1px solid rgba(250,204,21,.28);color:#f5e08a;margin-bottom:16px;font-size:13.5px}
.alert .ic{margin-top:2px;color:var(--wa)}
.empty{padding:44px 16px;text-align:center;color:var(--t2);border:1px dashed var(--ln);border-radius:var(--r)}
.empty .ic{width:30px;height:30px;color:var(--t3);margin-bottom:8px}

/* topups */
.tp{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.tp .amt{font-size:20px;font-weight:700;color:var(--cy)}
.tp .meta{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;color:var(--t2);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sl{max-width:100%;max-height:60vh;border-radius:12px;margin-top:12px;border:1px solid var(--ln)}
.mth{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%}.d-k{background:#13b34a}.d-t{background:#ff7a00}

/* products */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.pc:hover{border-color:#2f4272;transform:translateY(-2px)}
.pc .im{position:relative;aspect-ratio:16/10;background:#05070D;display:grid;place-items:center;color:var(--t3)}
.pc .im img{width:100%;height:100%;object-fit:cover}.pc.sold .im img{filter:grayscale(1) opacity(.55)}
.pc .im .pill{position:absolute;top:10px;left:10px;backdrop-filter:blur(6px);background-color:rgba(5,7,13,.7)}
.pc .im .cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);padding:1px 9px;border-radius:99px;font-size:12px}
.pc .bd{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pc h4{font-size:15px;font-weight:600;line-height:1.35}.pc .pr{font-size:19px;font-weight:700;color:var(--cy)}
.tags{display:flex;gap:5px;flex-wrap:wrap}.tags span{font-size:12px;color:var(--t2);background:var(--el);padding:1px 9px;border-radius:99px}
.pc details{font-size:12.5px;color:var(--t2)}.pc summary{cursor:pointer;color:var(--t2);list-style:none}.pc summary::-webkit-details-marker{display:none}.pc summary:hover{color:var(--cy)}
.pc details pre{white-space:pre-wrap;word-break:break-all;margin-top:6px;padding:9px 11px;background:var(--el);border-radius:9px;font:12.5px/1.5 ui-monospace,monospace;color:var(--tx)}
.pc .ft{display:flex;gap:6px;margin-top:auto;padding-top:6px}.pc .ft .btn{flex:1}.pc .ft .btn.no{flex:none}
.ths{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:68px;height:68px;border-radius:10px;overflow:hidden;border:1px solid var(--ln)}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.75);font-size:13px;line-height:1;display:grid;place-items:center}
.th button:hover{background:var(--er)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r);background:var(--sf)}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:12px;letter-spacing:.04em;color:var(--t3);font-weight:600;text-align:left;padding:12px 14px;border-bottom:1px solid var(--ln);background:rgba(17,26,45,.6);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid rgba(29,42,71,.7);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:rgba(17,26,45,.55)}
td.r,th.r{text-align:right}td.act{white-space:nowrap;text-align:right}
.ur{display:flex;align-items:center;gap:10px}.ur .av{width:30px;height:30px;font-size:13px}

/* coupons / tickets */
.cp{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cp .code{font:600 16px ui-monospace,monospace;letter-spacing:.06em;padding:6px 14px;border:1.5px dashed rgba(22,217,255,.5);border-radius:10px;color:var(--cy);background:rgba(22,217,255,.06)}
.cp .v{font-weight:600}
.tk h4{font-size:15px;font-weight:600}.tk .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tk .bodyt{white-space:pre-wrap;color:var(--tx);margin:6px 0 10px}
.tk .rp{padding:10px 12px;background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.25);border-radius:11px;color:#a8e8bf;font-size:13.5px;margin-bottom:10px}
.tk .rr{display:flex;gap:8px}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.ov.show{display:flex}
.md{width:100%;max-width:680px;background:var(--sf);border:1px solid var(--ln);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.md .hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--ln)}.md .hd h3{font-size:17px;font-weight:600;flex:1}
.md .x{width:32px;height:32px;border-radius:9px;color:var(--t2);font-size:20px;line-height:1}.md .x:hover{background:var(--el);color:var(--tx)}
.md .bd{padding:20px}.md .fo{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--ln)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--el2);border:1px solid var(--er);color:var(--tx);border-radius:12px;padding:11px 18px;z-index:80;transition:transform .3s;max-width:92vw}
.toast.show{transform:translate(-50%,0)}.toast.good{border-color:var(--ok)}

/* credit adjust + chart */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{padding:4px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--el);color:var(--t2);font-size:12.5px}
.chips button:hover{border-color:var(--cy);color:var(--tx)}
.seg button.neg.on{background:var(--er)}
.prev{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--el);border:1px solid var(--ln);margin-top:16px}
.prev b{font-size:20px}
.ch{margin-top:6px}.ch svg{width:100%;height:auto;display:block}
.ch .bar-r{fill:url(#cg)}.ch text{fill:var(--t3);font:11px Prompt,system-ui,sans-serif}.ch .v{fill:var(--tx);font-weight:600}
.ch .gl{stroke:var(--ln);stroke-width:1}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lg{width:100%;max-width:380px;padding:30px;border-radius:20px;background:linear-gradient(160deg,rgba(17,26,45,.92),rgba(11,16,32,.95));border:1px solid var(--ln);box-shadow:0 24px 70px rgba(0,0,0,.5);display:grid;gap:14px}
.lg .logo{width:48px;height:48px;font-size:21px;margin-bottom:2px}.lg h2{font-size:21px}.lg .back{text-align:center;font-size:13px}.lg .back:hover{color:var(--cy)}
#lerr{color:#ff8a8a;min-height:18px;font-size:13px}

/* responsive */
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--ln);overflow-x:auto}
  .brand{padding:0 8px 0 0}.brand div:last-child,.grp,.who,.side .sp{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 13px}.nav .bd{margin-left:4px}
  .main{padding-top:20px}
}
@media(max-width:620px){
  .fg{grid-template-columns:1fr}
  .tp{grid-template-columns:auto 1fr}.tp .amt{grid-column:2}
  .ph h1{font-size:21px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div id="login" hidden>
  <div class="lg">
    <div class="logo">N</div>
    <div><h2>ผู้ดูแลระบบ</h2><small>Nongpoom Shop · เข้าสู่ระบบเพื่อจัดการร้าน</small></div>
    <label class="fld">ชื่อผู้ใช้<input id="u" autocomplete="username" placeholder="ชื่อผู้ใช้"></label>
    <label class="fld">รหัสผ่าน<input id="p" type="password" autocomplete="current-password" placeholder="รหัสผ่าน"></label>
    <button class="btn pri" id="go">เข้าสู่ระบบ</button>
    <div id="lerr"></div>
    <a href="/" class="back mut">← กลับหน้าร้าน</a>
  </div>
</div>

<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="brand"><div class="logo">N</div><div><b>Nongpoom Shop</b><span>ระบบผู้ดูแล</span></div></div>
    <div id="nav" style="display:contents"></div>
    <div class="sp"></div>
    <div class="who"><div class="av" id="mav">A</div><div><b id="me">-</b><small id="whoRole">ผู้ดูแลระบบ</small></div></div>
    <a class="nav" href="/" id="goShop"></a>
    <button class="nav" id="out"></button>
  </aside>
  <main class="main"><div class="ph" id="ph"></div><div id="view"></div></main>
</div>

<div class="ov" id="ov"><div class="md" role="dialog" aria-modal="true"><div class="hd"><h3 id="mt"></h3><button class="x" onclick="closeMd()" aria-label="ปิด">×</button></div><div class="bd" id="mb"></div><div class="fo" id="mf"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const f=n=>'฿'+Number(n).toLocaleString('th-TH'),T=t=>t?new Date(t).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',dateStyle:'medium',timeStyle:'short'}):'-';
let ME={},tok=localStorage.getItem('np_token')||'',tab='sum',edit=null,eimgs=[],data={topF:'pending',prodF:'all',prodQ:'',memQ:'',ordQ:''},cnt={};
async function api(path,method='GET',body){
  const h={};if(tok)h.Authorization='Bearer '+tok;if(body!==undefined)h['Content-Type']='application/json';
  const r=await fetch(path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  const d=await r.json().catch(()=>({error:'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง'}));if(!r.ok)throw new Error(d.error||'ไม่สำเร็จ');return d}
let _tt;const say=(m,good)=>{const t=$('toast');t.textContent=m;t.classList.toggle('good',!!good);t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3200)};

/* icons */
const IC={
 grid:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
 box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.3 7L12 12l8.7-5"/><path d="M12 22V12"/>',
 bag:'<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 tag:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/>',
 chat:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',

/* sales chart (last 14 days, Bangkok time) */
function salesChart(orders){
  const day=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
  const days=[];for(let i=13;i>=0;i--)days.push(day(Date.now()-i*864e5));
  const sum=Object.fromEntries(days.map(d=>[d,0]));orders.forEach(o=>{const d=day(o.created);if(d in sum)sum[d]+=+o.total||0});
  const v=days.map(d=>sum[d]),tot=v.reduce((a,b)=>a+b,0),mx=Math.max(...v,1);
  $('chs').textContent='รวม '+f(tot);
  if(!tot){$('chart').innerHTML='<div class="empty" style="border:0;padding:30px">ยังไม่มียอดขายในช่วงนี้</div>';return}
  const W=760,H=220,pl=8,pb=28,pt=22,bw=(W-pl*2)/14;
  let g='<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16D9FF"/><stop offset="1" stop-color="#0866FF"/></linearGradient></defs>';
  [0,.5,1].forEach(k=>{const y=pt+(H-pt-pb)*(1-k);g+=`<line class="gl" x1="${pl}" x2="${W-pl}" y1="${y}" y2="${y}"/>`});
  v.forEach((x,i)=>{const h=(H-pt-pb)*x/mx,xx=pl+i*bw+bw*.18,y=H-pb-h,d=days[i].slice(8)+'/'+days[i].slice(5,7);
   g+=`<rect class="bar-r" x="${xx}" y="${y}" width="${bw*.64}" height="${Math.max(h,x?2:0)}" rx="5"><title>${d}: ${f(x)}</title></rect>`;
   if(x)g+=`<text class="v" x="${xx+bw*.32}" y="${y-6}" text-anchor="middle">${x>=1000?(x/1000).toFixed(1)+'k':x}</text>`;
   g+=`<text x="${xx+bw*.32}" y="${H-8}" text-anchor="middle">${d}</text>`});
  $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟยอดขาย 14 วันล่าสุด">${g}</svg>`}

   <label class="fld full">ชื่อสินค้า<input id="pn" placeholder="เช่น ไอดี Free Fire เลเวล 70" value="${E(x?.name||'')}"></label>
   <label class="fld">ราคา (บาท)<input id="pp" type="number" min="1" placeholder="0" value="${x?.price||''}"></label>
   <label class="fld">แท็ก (คั่นด้วย ,)<input id="pt" placeholder="ปืน EVO, เลเวล 70" value="${E((x?.tags||[]).join(', '))}"></label>
   <label class="fld full"><span>รายละเอียด <small class="t3">(ลูกค้าเห็น)</small></span><textarea id="pd" rows="2" placeholder="รายละเอียดสินค้า">${E(x?.descr||'')}</textarea></label>
   <label class="fld full"><span>ข้อมูลล็อกอินไอดี <small class="t3">(ลูกค้าเห็นหลังซื้อเท่านั้น)</small></span><textarea id="pc" rows="3" placeholder="ชื่อผู้ใช้ / รหัสผ่าน / อีเมลกู้คืน">${E(x?.cred||'')}</textarea></label>
   <div class="fld full"><span>รูปสินค้า <small class="t3">(สูงสุด 8 รูป)</small></span><div class="ths" id="ths"></div><input id="pi" type="file" accept="image/*" multiple onchange="imgSel()"><small class="t3" id="pis"></small></div></div>`,
   `<button class="btn" onclick="closeMd()">ยกเลิก</button><button class="btn pri" id="sv" onclick="saveP()">${x?'บันทึกการแก้ไข':'เพิ่มสินค้า'}</button>`);
  thumbs()}
function thumbs(){$('ths').innerHTML=eimgs.map((s,i)=>`<div class="th"><img src="${E(s)}" alt=""><button onclick="rmImg(${i})" aria-label="ลบรูป">×</button></div>`).join('')}
function rmImg(i){eimgs.splice(i,1);thumbs();imgSel()}
function imgSel(){const n=$('pi').files.length;$('pis').textContent=(n?`เลือกไฟล์ใหม่ ${n} รูป · `:'')+`รวมหลังบันทึกไม่เกิน 8 รูป (เดิม ${eimgs.length})`}
const shrink=fl=>new Promise((ok,no)=>{const rd=new FileReader();rd.onerror=no;rd.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const s=Math.min(1,960/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};i.src=rd.result};rd.readAsDataURL(fl)});
async function saveP(){
  const btn=$('sv');btn.disabled=true;let im=[];
  try{for(const fl of [...$('pi').files].slice(0,8))im.push(await shrink(fl))}catch(e){btn.disabled=false;return say('อ่านรูปไม่ได้')}
  const old=edit?data.prod.find(p=>p.id===edit):null,b={name:$('pn').value,price:+$('pp').value,tags:$('pt').value.split(',').map(s=>s.trim()).filter(Boolean),descr:$('pd').value,cred:$('pc').value,imgs:[...eimgs,...im].slice(0,8),sold:old?old.sold:false};
  try{if(edit)await api('/api/admin/products/'+edit,'PUT',b);else await api('/api/admin/products','POST',b);closeMd();edit=null;say(old?'บันทึกการแก้ไขแล้ว':'เพิ่มสินค้าแล้ว',true);show('prod')}catch(e){btn.disabled=false;say(e.message)}}
function toggleSold(id){const p=data.prod.find(x=>x.id===id);act(()=>api('/api/admin/products/'+id,'PUT',{name:p.name,price:p.price,tags:p.tags,descr:p.descr,cred:p.cred,imgs:p.imgs,sold:!p.sold}))}
function delP(id){if(confirm('ลบสินค้านี้? (ลบไม่ได้ถ้ามีประวัติการขาย)'))act(()=>api('/api/admin/products/'+id,'DELETE'),'ลบสินค้าแล้ว')}

/* members */
function memList(){
  const Q=data.memQ.trim().toLowerCase(),v=data.mem.filter(m=>!Q||((m.username||'')+' '+(m.phone||'')).toLowerCase().includes(Q));
  $('mcnt').textContent=v.length+' บัญชี';
  $('mlist').innerHTML=v.length?`<div class="tw"><table><thead><tr><th>ผู้ใช้</th><th>เบอร์โทร</th><th class="r">เครดิต</th><th>เข้าใช้ล่าสุด</th><th></th></tr></thead><tbody>`+v.map(m=>{const isA=m.role==='admin',canRole=ME.owner&&!m.owner&&m.id!==ME.id,canPw=!isA||ME.owner||m.id===ME.id;
   return `<tr><td><div class="ur"><div class="av">${E((m.username||'?')[0].toUpperCase())}</div><b>${E(m.username)}</b>${m.owner?'<span class="pill p-wa">เจ้าของร้าน</span>':isA?'<span class="pill p-bl">ผู้ดูแล</span>':''}</div></td><td>${E(m.phone||'-')}</td><td class="r"><b style="color:var(--cy)">${f(m.balance)}</b></td><td class="mut">${T(m.last_seen)}</td><td class="act"><div class="acts" style="justify-content:flex-end"><button class="btn sm" onclick="info(${m.id})">ดูข้อมูล</button>${canPw?`<button class="btn sm" onclick="resetPw(${m.id})">รหัสผ่าน</button>`:''}<button class="btn sm pri" onclick="adjust(${m.id})">ปรับเครดิต</button>${canRole?`<button class="btn sm ${isA?'no':''}" onclick="setRole(${m.id},'${isA?'user':'admin'}')">${isA?'ถอดผู้ดูแล':'ตั้งเป็นผู้ดูแล'}</button>`:''}</div></td></tr>`}).join('')+'</tbody></table></div>':empty('ไม่พบสมาชิก','users')}
const stOrd={pending:'รอตรวจสอบ',approved:'อนุมัติแล้ว',rejected:'ปฏิเสธแล้ว'};
async function info(id){try{const d=await api('/api/admin/members/'+id),m=d.member,tb=(h,rows,cols)=>rows.length?`<div class="tw" style="margin-bottom:14px"><table style="min-width:0"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="mut" style="margin-bottom:14px">ไม่มีรายการ</div>';
  openMd('ข้อมูลสมาชิก · '+m.username,`<div class="fg" style="margin-bottom:16px"><div class="fld">ชื่อผู้ใช้<b style="color:var(--tx)">${E(m.username)}</b></div><div class="fld">รหัสผ่าน<span style="color:var(--tx)">••••••••  <small class="t3">(เก็บแบบเข้ารหัสทางเดียว ดูไม่ได้ ใช้ปุ่ม "รหัสผ่าน" เพื่อตั้งใหม่ให้ลูกค้า)</small></span></div><div class="fld">เบอร์โทร<b style="color:var(--tx)">${E(m.phone||'-')}</b></div><div class="fld">สิทธิ์<b style="color:var(--tx)">${m.owner?'เจ้าของร้าน':m.role==='admin'?'ผู้ดูแล':'สมาชิก'}</b></div><div class="fld">เครดิตคงเหลือ<b style="color:var(--cy);font-size:18px">${f(m.balance)}</b></div><div class="fld">สมัครเมื่อ / เข้าใช้ล่าสุด<span style="color:var(--tx)">${T(m.created)} / ${T(m.last_seen)}</span></div></div>
  <h4 style="margin:6px 0 8px">คำสั่งซื้อ (${d.orders.length})</h4>${tb(['เลขที่','สินค้า','ชำระ','ข้อมูลไอดีที่ส่งมอบ','เวลา'],d.orders,o=>[E(o.no),E(o.product),f(o.total),`<small style="word-break:break-all">${E(o.credentials||'')}</small>`,T(o.created)])}
  <h4 style="margin:6px 0 8px">เติมเงิน (${d.topups.length})</h4>${tb(['อ้างอิง','ช่องทาง','จำนวน','สถานะ','เวลา'],d.topups,t=>[E(t.ref),t.method==='kbank'?'กสิกร':'TrueMoney',f(t.amount),E(stOrd[t.status]||t.status),T(t.created)])}
  <h4 style="margin:6px 0 8px">ประวัติเครดิต (ล่าสุด)</h4>${tb(['เวลา','ประเภท','จำนวน','หมายเหตุ'],d.ledger,x=>[T(x.created),E(x.kind),`<b style="color:${x.delta<0?'var(--er)':'var(--ok)'}">${x.delta>0?'+':''}${x.delta}</b>`,E((x.ref||'')+' '+(x.note||''))])}
  <h4 style="margin:6px 0 8px">แจ้งปัญหา (${d.tickets.length})</h4>${tb(['หัวข้อ','รายละเอียด','คำตอบ'],d.tickets,t=>[E(t.subject),E(t.body),E(t.reply||'-')])}`,
  `<button class="btn" onclick="closeMd()">ปิด</button>`)}catch(e){say(e.message)}}
function resetPw(id){const m=data.mem.find(x=>x.id===id);
  openMd('ตั้งรหัสผ่านใหม่ · '+m.username,`<div class="alert">${ic('alert')}<div>ระบบเก็บรหัสผ่านแบบเข้ารหัสทางเดียว จึงดูรหัสเดิมไม่ได้ แต่ตั้งรหัสใหม่ให้ลูกค้าได้ เมื่อบันทึกแล้วอุปกรณ์ที่ล็อกอินอยู่จะถูกออกจากระบบทันที</div></div>
  <label class="fld">รหัสผ่านใหม่ <small class="t3">(เว้นว่าง = ให้ระบบสุ่มให้ · อย่างน้อย 8 ตัวอักษร)</small><input id="npw" maxlength="200" placeholder="เว้นว่างเพื่อสุ่มรหัส" autocomplete="off"></label>
  <div id="npr"></div>`,`<button class="btn" onclick="closeMd()">ปิด</button><button class="btn pri" id="npb" onclick="doResetPw(${id})">ตั้งรหัสผ่านใหม่</button>`)}
async function doResetPw(id){const b=$('npb'),pw=$('npw').value;if(!confirm('ยืนยันตั้งรหัสผ่านใหม่ให้สมาชิกคนนี้? รหัสเดิมจะใช้ไม่ได้ทันที'))return;b.disabled=true;
  try{const d=await api(`/api/admin/members/${id}/password`,'POST',pw?{password:pw}:{});
   $('npr').innerHTML=`<div class="prev" style="flex-direction:column;align-items:stretch;gap:8px"><span class="mut">รหัสผ่านใหม่ของ ${E(d.username)} (แสดงครั้งเดียว ส่งให้ลูกค้าแล้วแนะนำให้เปลี่ยนเอง)</span><b id="npv" style="font:600 20px ui-monospace,monospace;letter-spacing:.04em;word-break:break-all">${E(d.password)}</b><button class="btn sm" onclick="try{navigator.clipboard.writeText($('npv').textContent);say('คัดลอกแล้ว',true)}catch(e){say('คัดลอกไม่ได้ กรุณาเลือกข้อความเอง')}">คัดลอก</button></div>`;b.hidden=true;$('npw').disabled=true;say('ตั้งรหัสผ่านใหม่แล้ว',true)}
  catch(e){b.disabled=false;say(e.message)}}
function setRole(id,role){const m=data.mem.find(x=>x.id===id);if(confirm(role==='admin'?`ตั้ง ${m.username} เป็นผู้ดูแล? จะเห็นข้อมูลลูกค้า ปรับเครดิต และอนุมัติเติมเงินได้`:`ถอดสิทธิ์ผู้ดูแลของ ${m.username}?`))act(()=>api(`/api/admin/members/${id}/role`,'POST',{role}),role==='admin'?'ตั้งเป็นผู้ดูแลแล้ว (ให้เขาเข้าสู่ระบบใหม่)':'ถอดสิทธิ์แล้ว')}
function adjust(id){
  const m=data.mem.find(x=>x.id===id);adj={id,sign:1,bal:+m.balance||0};
  openMd('ปรับเครดิต · '+m.username,`<div class="prev" style="margin:0 0 16px"><span class="mut">เครดิตปัจจุบัน</span><b style="color:var(--cy)">${f(m.balance)}</b></div>
  <div class="seg" style="display:flex;margin-bottom:16px"><button id="sgA" class="on" style="flex:1" onclick="adjSign(1)">＋ เพิ่มเครดิต</button><button id="sgS" class="neg" style="flex:1" onclick="adjSign(-1)">－ หักเครดิต</button><button id="sgT" style="flex:1" onclick="adjSign(0)">＝ ตั้งยอดเป็น</button></div>
  <label class="fld">จำนวนเงิน (บาท)<input id="aamt" type="number" min="1" step="1" inputmode="numeric" placeholder="0" oninput="adjPrev()"></label>
  <div class="chips">${[50,100,300,500,1000].map(n=>`<button type="button" onclick="$('aamt').value=${n};adjPrev()">${n}</button>`).join('')}</div>
  <label class="fld" style="margin-top:16px"><span>เหตุผล <small class="t3">(บังคับ อย่างน้อย 3 ตัวอักษร · บันทึกในประวัติ)</small></span><input id="arsn" maxlength="200" placeholder="เช่น เติมให้ตามสลิป"></label>
  <div class="chips">${['เติมให้ตามสลิป','คืนเครดิต','แก้ไขข้อผิดพลาด','โปรโมชัน'].map(t=>`<button type="button" onclick="$('arsn').value='${t}'">${t}</button>`).join('')}</div>
  <div class="prev"><span class="mut">เครดิตหลังปรับ</span><b id="anew">${f(m.balance)}</b></div>`,
  `<button class="btn" onclick="closeMd()">ยกเลิก</button><button class="btn pri" id="asv" onclick="adjSave()">ยืนยันการปรับเครดิต</button>`);
  setTimeout(()=>$('aamt').focus(),50)}
let adj={id:0,sign:1,bal:0};
function adjSign(n){adj.sign=n;$('sgA').classList.toggle('on',n>0);$('sgS').classList.toggle('on',n<0);$('sgT').classList.toggle('on',n===0);adjPrev()}
function adjPrev(){const v=Math.floor(+$('aamt').value)||0,nb=adj.sign===0?($('aamt').value===''?adj.bal:v):adj.bal+adj.sign*v,e=$('anew');e.textContent=f(nb);e.style.color=nb<0?'var(--er)':(nb===adj.bal?'var(--tx)':(nb>adj.bal?'var(--ok)':'var(--wa)'))}
async function adjSave(){
  const v=Number($('aamt').value),r=$('arsn').value.trim(),m=data.mem.find(x=>x.id===adj.id),set=adj.sign===0;
  if($('aamt').value===''||!Number.isInteger(v)||v<0||(!set&&v<=0))return say(set?'กรอกยอดที่ต้องการตั้งเป็นจำนวนเต็ม 0 ขึ้นไป':'กรอกจำนวนเงินเป็นจำนวนเต็มที่มากกว่า 0');
  if(r.length<3)return say('ต้องระบุเหตุผลอย่างน้อย 3 ตัวอักษร');
  if(adj.sign<0&&v>adj.bal)return say('หักเกินเครดิตที่มีอยู่ ('+f(adj.bal)+')');
  if(!confirm(set?`ตั้งเครดิตของ ${m.username} จาก ${f(adj.bal)} เป็น ${f(v)}\nเหตุผล: ${r}\n\nยืนยันหรือไม่?`:`${adj.sign>0?'เพิ่ม':'หัก'}เครดิต ${f(v)} ${adj.sign>0?'ให้':'จาก'} ${m.username}\nเหตุผล: ${r}\n\nยืนยันหรือไม่?`))return;
  const b=$('asv');b.disabled=true;
  try{await api(`/api/admin/members/${adj.id}/adjust`,'POST',set?{set:v,reason:r}:{delta:adj.sign*v,reason:r});closeMd();say('ปรับเครดิตเรียบร้อยแล้ว',true);show('mem')}catch(e){b.disabled=false;say(e.message)}}
async function ledger(id){try{const u=data.mem.find(x=>x.id===id).username,l=await api('/api/admin/ledger/'+id);
  openMd('ประวัติเครดิต · '+u,l.length?`<div class="tw"><table><thead><tr><th>เวลา</th><th>ประเภท</th><th class="r">จำนวน</th><th>อ้างอิง/หมายเหตุ</th></tr></thead><tbody>`+l.map(x=>`<tr><td class="mut">${T(x.created)}</td><td>${E(x.kind)}</td><td class="r" style="color:${x.delta<0?'var(--er)':'var(--ok)'};font-weight:600">${x.delta>0?'+':''}${x.delta}</td><td class="mut">${E(x.ref||'')} ${E(x.note||'')}</td></tr>`).join('')+'</tbody></table></div>':empty('ยังไม่มีรายการ'))}catch(e){say(e.message)}}

/* orders */
function ordList(){
  const Q=data.ordQ.trim().toLowerCase(),v=data.ord.filter(o=>!Q||((o.no||'')+' '+(o.username||'')+' '+(o.product||'')).toLowerCase().includes(Q));
  $('ocnt').textContent=v.length+' รายการ · รวม '+f(v.reduce((a,o)=>a+(+o.total||0),0));
  $('olist').innerHTML=v.length?`<div class="tw"><table><thead><tr><th>เลขที่</th><th>ผู้ซื้อ</th><th>สินค้า</th><th class="r">ราคา</th><th class="r">ส่วนลด</th><th class="r">ชำระ</th><th>เวลา</th></tr></thead><tbody>`+v.map(o=>`<tr><td><b>${E(o.no)}</b></td><td>${E(o.username)}</td><td>${E(o.product)}</td><td class="r">${f(o.price)}</td><td class="r">${o.discount?`<span class="pill p-bl">${f(o.discount)} ${E(o.coupon||'')}</span>`:'<span class="t3">-</span>'}</td><td class="r"><b style="color:var(--cy)">${f(o.total)}</b></td><td class="mut">${T(o.created)}</td></tr>`).join('')+'</tbody></table></div>':empty('ไม่พบออเดอร์','bag')}

/* coupons & tickets */
function addK(){act(()=>api('/api/admin/coupons','POST',{code:$('kc').value.toUpperCase(),type:$('kt').value,val:+$('kv').value,minspend:+$('km').value||0,remaining:+$('kr').value}),'เพิ่มคูปองแล้ว')}
function delK(c){if(confirm('ลบคูปอง '+c+'?'))act(()=>api('/api/admin/coupons/'+c,'DELETE'),'ลบคูปองแล้ว')}
function reply(id){const v=$('rp'+id).value.trim();if(!v)return;act(()=>api(`/api/admin/tickets/${id}/reply`,'POST',{reply:v}),'ส่งคำตอบแล้ว')}
boot();
</script></body></html>
